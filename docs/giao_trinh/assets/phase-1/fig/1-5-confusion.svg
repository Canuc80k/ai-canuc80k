<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Bốn ô đếm dự đoán đúng và sai theo nhãn thật và dự đoán.</title><text x="80" y="125" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="400">Thật 0</text><text x="80" y="246" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="400">Thật 1</text><text x="241" y="28" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="400">Đoán 0</text><text x="426" y="28" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="400">Đoán 1</text><rect x="152" y="61" width="178" height="112" rx="0" fill="var(--t-n, #3b6ea8)" fill-opacity="0.08" stroke="var(--t-n, #3b6ea8)" stroke-width="1.2"/><text x="241" y="117" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="400">TN = 3</text><rect x="337" y="61" width="178" height="112" rx="0" fill="var(--accent, #c2603e)" fill-opacity="0.08" stroke="var(--accent, #c2603e)" stroke-width="1.2"/><text x="426" y="117" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="400">FP = 3</text><rect x="152" y="182" width="178" height="112" rx="0" fill="var(--accent, #c2603e)" fill-opacity="0.08" stroke="var(--accent, #c2603e)" stroke-width="1.2"/><text x="241" y="238" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="400">FN = 1</text><rect x="337" y="182" width="178" height="112" rx="0" fill="var(--t-n, #3b6ea8)" fill-opacity="0.08" stroke="var(--t-n, #3b6ea8)" stroke-width="1.2"/><text x="426" y="238" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="400">TP = 3</text></svg>