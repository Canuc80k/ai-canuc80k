<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" role="img" aria-label="IoU là diện tích giao chia diện tích hợp của hai box." style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>IoU là diện tích giao chia diện tích hợp của hai box.</title><rect x="182" y="35" width="180" height="180" rx="0" fill="var(--t-n, #3b6ea8)" fill-opacity="0.08" stroke="var(--t-n, #3b6ea8)" stroke-width="1.2"/><rect x="227" y="80" width="180" height="180" rx="0" fill="var(--accent, #c2603e)" fill-opacity="0.08" stroke="var(--accent, #c2603e)" stroke-width="1.2"/><rect x="227" y="80" width="135" height="135" rx="0" fill="#b8892b" fill-opacity="0.12" stroke="#b8892b" stroke-width="1.2"/><text x="152" y="115" fill="var(--t-n, #3b6ea8)" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="400">A</text><text x="437" y="170" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="400">B</text><text x="294.5" y="147.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="26" font-weight="400">9</text><text x="320" y="300" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="400">IoU = 9 / (16 + 16 − 9) = 9/23</text></svg>