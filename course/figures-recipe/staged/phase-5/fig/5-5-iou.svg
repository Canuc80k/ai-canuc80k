<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Ví dụ tính tay: A = (0, 0, 4, 4), B = (1, 1, 5, 5) giao nhau ở ô 3×3; IoU = 9 / (16 + 16 − 9) = 9/23 ≈ 0.39.</title><rect x="84.1667" y="34.1667" width="113.333" height="113.333" rx="1" fill="var(--t-n, #2f6587)" fill-opacity="0.12" stroke="var(--t-n, #2f6587)" stroke-width="1.8"/><text x="90.1667" y="47.1667" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="600">A</text><rect x="112.5" y="62.5" width="113.333" height="113.333" rx="1" fill="var(--accent, #c2603e)" fill-opacity="0.12" stroke="var(--accent, #c2603e)" stroke-width="1.8"/><text x="118.5" y="75.5" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="600">B</text><rect x="112.5" y="62.5" width="85" height="85" rx="0" fill="var(--t-s, #4d7337)" fill-opacity="0.3" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="155" y="105" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="600">9</text><text xml:space="preserve" style="font-variant-ligatures:none" x="310" y="70" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="400">giao  = 3·3 = 9</text><text xml:space="preserve" style="font-variant-ligatures:none" x="310" y="100" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="400">hợp   = 16 + 16 − 9 = 23</text><text xml:space="preserve" style="font-variant-ligatures:none" x="310" y="140" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13.5" font-weight="600">IoU   = 9/23 ≈ 0.391</text><text x="310" y="176" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">chưa đạt ngưỡng 0.5</text></svg>