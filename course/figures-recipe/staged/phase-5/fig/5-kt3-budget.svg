<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Ngân sách 4 giờ của câu hỏi: trừ 20 phút chạy test, 10 phút nạp lại và kiểm file, 30 phút dự phòng; còn 180 phút cho 15 epoch, mỗi epoch 12 phút.</title><rect x="30" y="50" width="433" height="40" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text x="247.5" y="70" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">train 15 epoch</text><text xml:space="preserve" style="font-variant-ligatures:none" x="247.5" y="108" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">180 phút</text><rect x="465" y="50" width="46.3333" height="40" rx="4" fill="var(--t-s, #4d7337)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="489.167" y="70.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">20</text><text x="489.167" y="108" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">test</text><rect x="513.333" y="50" width="22.1667" height="40" rx="4" fill="#b8892b" fill-opacity="0.35" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="525.417" y="70.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">10</text><text x="525.417" y="124" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">nạp lại</text><rect x="537.5" y="50" width="70.5" height="40" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="573.75" y="70.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">30</text><text x="573.75" y="108" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">dự phòng</text><text x="320" y="32" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">4 giờ = 240 phút</text><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="146" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">(240 − 20 − 10 − 30) / 12 = 15 epoch</text></svg>