<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Mã số áp một thứ tự cách đều; one-hot cho mỗi danh mục một cột riêng.</title><text x="150" y="16" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="14" font-weight="600">Mã số 0, 1, 2</text><path d="M 42,84 L 258,84" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2" stroke-linecap="round"/><circle cx="60" cy="84" r="6" fill="var(--accent, #c2603e)" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="1.4"/><text x="60" y="108" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13" font-weight="400">sáng</text><text xml:space="preserve" style="font-variant-ligatures:none" x="60" y="62" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="400">0</text><circle cx="150" cy="84" r="6" fill="var(--accent, #c2603e)" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="1.4"/><text x="150" y="108" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13" font-weight="400">chiều</text><text xml:space="preserve" style="font-variant-ligatures:none" x="150" y="62" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="400">1</text><circle cx="240" cy="84" r="6" fill="var(--accent, #c2603e)" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="1.4"/><text x="240" y="108" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans