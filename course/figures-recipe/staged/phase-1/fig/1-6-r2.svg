<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" width="640" role="img" aria-label="Tổng lỗi bình phương: model 17, đoán trung bình 200." style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Tổng lỗi bình phương: model 17, đoán trung bình 200.</title><text x="40" y="16" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13" font-weight="600">model</text><rect x="40" y="124" width="16" height="16" rx="3" fill="var(--accent, #c2603e)" fill-opacity="0.45" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="48" y="154" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">4</text><rect x="72" y="124" width="16" height="16" rx="3" fill="var(--accent, #c2603e)" fill-opacity="0.45" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="80" y="154" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">4</text><rect x="104" y="116" width="24" height="24" rx="3" fill="var(--accent, #c2603e)" fill-opacity="0.45" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="116" y="154" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">9</text><text xml:space="preserve" style="font-variant-ligatures:none" x="40" y="180" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">4 + 4 + 9 = 17</text><text x="340" y="16" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13" font-weight="600">đoán trung bình 20</text><rect x="340" y="60" width="80" height="80" rx="3" fill="#b8892b" fill-opacity="0.45" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="380" y="154" fill="#b8892b" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">100</text><text xml:space="preserve" style="font-variant-ligatures:none" x="442" y="154" fill="#b8892b" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">0</text><rect x="464" y="60" width="80" height="80" rx="3" fill="#b8892b" fill-opacity="0.45" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="504" y="154" fill="#b8892b" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">100</text><text xml:space="preserve" style="font-variant-ligatures:none" x="340" y="180" fill="#b8892b" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">100 + 0 + 100 = 200</text><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="222" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13.5" font-weight="600">R² = 1 − 17 / 200 = 0.915</text></svg>