' font-size="12" font-weight="400">10%: giữ nguyên</text><rect x="210" y="136" width="35" height="28" rx="6" fill="var(--faint, #a19e94)" fill-opacity="0.12" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="227.5" y="150.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">An</text><rect x="251" y="136" width="43.5" height="28" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.3" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="272.75" y="150.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">đọc</text><rect x="300.5" y="136" width="52" height="28" rx="6" fill="var(--faint, #a19e94)" fill-opacity="0.12" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="326.5" y="150.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">sách</text><text xml:space="preserve" style="font-variant-ligatures:none" x="372.5" y="150.5" fill="var(--t-s, #4d7337)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">→ đoán “đọc”</text><text x="320" y="200" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">nhãn luôn là token gốc; vị trí không được chọn mang -100</text></svg>