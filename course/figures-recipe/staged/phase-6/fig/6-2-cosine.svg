nt-weight="600">tài liệu 3 (−1, −1)</text><path d="M 180,130 L 224,86" fill="none" stroke="var(--t-n, #2f6587)" stroke-width="3" stroke-linecap="round"/><path d="M 221.141,93.4719 L 224,86 L 216.528,88.8586" fill="none" stroke="var(--t-n, #2f6587)" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="30" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="600">mũi tên đậm: query (1, 1)</text><text x="470" y="60" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">cosine với query (1, 1)</text><text x="450" y="90" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">tài liệu 1</text><text xml:space="preserve" style="font-variant-ligatures:none" x="480" y="90" fill="var(--t-s, #4d7337)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">1</text><text x="450" y="120" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">tài liệu 2</text><text xml:space="preserve" style="font-variant-ligatures:none" x="480" y="120" fill="#b8892b" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">0.707</text><text x="450" y="150" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">tài liệu 3</text><text xml:space="preserve" style="font-variant-ligatures:none" x="480" y="150" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseli