<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" role="img" aria-label="Nút thắt là retriever: chỉ 60/100 câu có đoạn đúng trong top-3." style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Nút thắt là retriever: chỉ 60/100 câu có đoạn đúng trong top-3.</title><rect x="60" y="40" width="520" height="34" rx="4" fill="var(--faint, #a19e94)" fill-opacity="0.14" stroke="none" stroke-width="0"/><rect x="60" y="40" width="312" height="34" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.3" stroke="none" stroke-width="0"/><text x="216" y="57" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">đoạn đúng trong top-3: 60</text><text x="476" y="57" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">thiếu đoạn đúng: 40</text><rect x="60" y="100" width="296.4" height="34" rx="4" fill="var(--t-s, #4d7337)" fill-opacity="0.4" stroke="none" stroke-width="0"/><rect x="356.4" y="100" width="15.6" height="34" rx="1" fill="var(--accent, #c2603e)" fill-opacity="0.5" stroke="none" stroke-width="0"/><text x="208.2" y="117" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">LLM trả đúng: 57</text><text xml:space="preserve" style="font-variant-ligatures:none" x="378" y="117" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">3 sai</text><text x="50" y="57" fill="var(--muted, #73716a)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">retriever</text><text x="50" y="117" fill="var(--muted, #73716a)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">đọc</text><text x="320" y="170" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">recall@3 = 0.6 là trần của cả hệ; tầng đọc đúng 57/60</text><text x="320" y="192" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="600">sửa retriever trước</text></svg>