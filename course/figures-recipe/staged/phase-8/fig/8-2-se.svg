<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Khoảng accuracy ± 2 sai số chuẩn: camera cũ 0.90 ± 0.06 với 90 mẫu, camera mới 0.20 ± 0.25 với 10 mẫu, trải từ gần 0 đến khoảng 0.45.</title><path d="M 130,140 L 530,140" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1" stroke-linecap="round"/><text x="130" y="154" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">0</text><text x="230" y="154" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">0.25</text><text x="330" y="154" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">0.5</text><text x="430" y="154" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">0.75</text><text x="530" y="154" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">1</text><text x="530" y="170" fill="var(--faint, #a19e94)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">accuracy</text><path d="M 464.702,57.5 L 515.298,57.5" fill="none" stroke="var(--t-n, #2f6587)" stroke-width="3" stroke-linecap="round"/><circle cx="490" cy="57.5" r="5" fill="var(--t-n, #2f6587)" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1.4"/><text x="120" y="57.5" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI"