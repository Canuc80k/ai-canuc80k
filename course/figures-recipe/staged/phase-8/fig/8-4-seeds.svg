<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 206" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Log loss tune của năm seed forest (số từ output bài) trải 0.031, lớn hơn sáu lần mức chênh 0.005 giữa equal weights và forest; trung bình năm seed 0.219 nằm sát trung bình các bản đơn.</title><path d="M 90,70 L 550,70" fill="none" stroke="var(--line, #e6e2d6)" stroke-width="1.2" stroke-linecap="round"/><circle cx="386.444" cy="70" r="6" fill="var(--t-n, #2f6587)" fill-opacity="0.6" stroke="var(--t-n, #2f6587)" stroke-width="0"/><circle cx="484.578" cy="70" r="6" fill="var(--t-n, #2f6587)" fill-opacity="0.6" stroke="var(--t-n, #2f6587)" stroke-width="0"/><circle cx="468.222" cy="70" r="6" fill="var(--t-n, #2f6587)" fill-opacity="0.6" stroke="var(--t-n, #2f6587)" stroke-width="0"/><circle cx="249.467" cy="70" r="6" fill="var(--t-n, #2f6587)" fill-opacity="0.6" stroke="var(--t-n, #2f6587)" stroke-width="0"/><circle cx="166.667" cy="70" r="6" fill="var(--t-n, #2f6587)" fill-opacity="0.6" stroke="var(--t-n, #2f6587)" stroke-width="0"/><path d="M 166.667,46 L 484.578,46" fill="none" stroke="var(--t-n, #2f6587)" stroke-width="1.2" stroke-linecap="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="325.622" y="34" fill="var(--t-n, #2f6587)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">năm seed forest: dao động 0.031</text><circle cx="337.378" cy="70" r="7" fill="none" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="2"/><text xml:space="preserve" style="font-variant-ligatures:none" x="337.378" y="96" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">trung bình 5 seed 0.219</text><path d="M 335.333,120 L 386.444,120" fill="none" stroke="var(--t-s, #4d73