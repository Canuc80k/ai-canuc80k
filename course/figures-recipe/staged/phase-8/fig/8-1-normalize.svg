<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" role="img" aria-label="Cùng thang điểm chuẩn hóa: accuracy 0.70 ở bài A được 37.5 điểm, 0.75 ở bài B được 50." style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Cùng thang điểm chuẩn hóa: accuracy 0.70 ở bài A được 37.5 điểm, 0.75 ở bài B được 50.</title><text x="66" y="61" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13" font-weight="600">A</text><rect x="165.333" y="50" width="341.333" height="22" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.18" stroke="none" stroke-width="0"/><rect x="165.333" y="50" width="128" height="22" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.4" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="165.333" y="86" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">0.58 → 0</text><text xml:space="preserve" style="font-variant-ligatures:none" x="506.667" y="86" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">0.90 → 100</text><circle cx="293.333" cy="61" r="4.5" fill="var(--t-n, #2f6587)" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1.4"/><text xml:space="preserve" style="font-variant-ligatures:none" x="293.333" y="40" fill="var(--t-n, #2f6587)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="600">0.70 → 37.5</text><text x="66" y="125" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13" font-weight="600">B</text><rect x="186.667" y="114" width="320"