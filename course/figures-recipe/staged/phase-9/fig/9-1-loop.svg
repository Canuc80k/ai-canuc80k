<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" role="img" aria-label="Agent chọn hành động; environment trả phần thưởng và trạng thái mới." style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Agent chọn hành động; environment trả phần thưởng và trạng thái mới.</title><rect x="40" y="70" width="150" height="60" rx="8" fill="var(--t-n, #2f6587)" fill-opacity="0.2" stroke="none" stroke-width="0"/><text x="115" y="92" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13" font-weight="600">agent</text><text xml:space="preserve" style="font-variant-ligatures:none" x="115" y="112" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">π(a | s), Q(s, a)</text><rect x="450" y="70" width="150" height="60" rx="8" fill="#b8892b" fill-opacity="0.3" stroke="none" stroke-width="0"/><text x="525" y="92" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13" font-weight="600">environment</text><text xml:space="preserve" style="font-variant-ligatures:none" x="525" y="112" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">step(s, a)</text><path d="M 190,82 Q 320,35.2 450,82" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.6" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 442.022,82.595 L 450,82 L 444.232,76.4565" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.6" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="40" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="600">hành động A_t</text><path d="M 450,120 Q 320,166.8 190,120" fill="none" stroke="var(--t-s, #4d7337)" stroke-width="1.6" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 197.978,119.405 L 190,120 L 195.768,125.544" fill="none" stroke="var(--t-s, #4d7337)" stroke-width="1.6" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="172" fill="var(--t-s, #4d7337)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="600">thưởng R_{t+1}, trạng thái S_{t+1}</text></svg>