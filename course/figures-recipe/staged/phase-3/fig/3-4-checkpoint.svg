<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Packet checkpoint của bài: trọng số, mean và scale của train, cùng đầu vào kiểm và logits mong đợi; một tiến trình Python mới chỉ dùng packet mà vẫn cho cùng kết quả.</title><rect x="40" y="36" width="170" height="156" rx="10" fill="var(--surface, #ffffff)" fill-opacity="1" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2"/><text xml:space="preserve" style="font-variant-ligatures:none" x="125" y="22" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">3-4-best.pt</text><text xml:space="preserve" style="font-variant-ligatures:none" x="60" y="54" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">state</text><text xml:space="preserve" style="font-variant-ligatures:none" x="60" y="78" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">mean</text><text xml:space="preserve" style="font-variant-ligatures:none" x="60" y="102" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">scale</text><text xml:space="preserve" style="font-variant-ligatures:none" x="60" y="126" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">query</text><text xml:space="preserve" style="font-variant-ligatures:none" x="60" y="150" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">expected</text><text xml:space="preserve" style="font-variant-ligatures:none" x="60" y="174" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">epoch</text><path d="M 222,110 L 300,110" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.4" stroke-linecap="round"/><path d="M 292.695,113.262 L 300,110 L 292.695,106.738" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="66" width="150" height="88" rx="10" fill="var(--accent, #c2603e)" fill-opacity="0.12" stroke="none" stroke-width="0"/><text x="385" y="92" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="600">tiến trình Python mới</text><text xml:space="preserve" style="font-variant-ligatures:none" x="385" y="114" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">make_model()</text><text xml:space="preserve" style="font-variant-ligatures:none" x="385" y="134" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">load_state_dict</text><path d="M 470,110 L 520,110" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.4" stroke-linecap="round"/><path d="M 512.695,113.262 L 520,110 L 512.695,106.738" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="530" y="100" fill="var(--t-s, #4d7337)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">match: True</text><text xml:space="preserve" style="font-variant-ligatures:none" x="530" y="122" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">[1, 0]</text><text x="125" y="200" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">đủ để suy luận, chưa đủ để train tiếp</text></svg>