<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" role="img" aria-label="Chain rule nhân các đạo hàm cục bộ trên đường từ J về w." style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Chain rule nhân các đạo hàm cục bộ trên đường từ J về w.</title><text x="80" y="34" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="400">w</text><circle cx="80" cy="108" r="29" fill="none" fill-opacity="1" stroke="var(--t-n, #3b6ea8)" stroke-width="1.4"/><text x="80" y="108" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="400">2</text><text x="310" y="34" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="400">u = 3w</text><circle cx="310" cy="108" r="29" fill="none" fill-opacity="1" stroke="var(--t-n, #3b6ea8)" stroke-width="1.4"/><text x="310" y="108" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="400">6</text><text x="560" y="34" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="400">J = (u−1)²</text><circle cx="560" cy="108" r="29" fill="none" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="1.4"/><text x="560" y="108" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="400">25</text><path d="M 115,108 L 273,108" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M 265.695,111.262 L 273,108 L 265.695,104.738" fill="none" stroke="currentColor" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="196" y="80" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">× 3</text><path d="M 345,108 L 523,108" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M 515.695,111.262 L 523,108 L 515.695,104.738" fill="none" stroke="currentColor" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 523,225 L 345,225" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.4" stroke-linecap="round"/><path d="M 352.305,221.738 L 345,225 L 352.305,228.262" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="198" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">∂J/∂u = 10</text><path d="M 273,225 L 115,225" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.4" stroke-linecap="round"/><path d="M 122.305,221.738 L 115,225 L 122.305,228.262" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="198" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400">× 3</text><text x="80" y="225" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="400">30</text><text x="560" y="225" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="400">10</text></svg>