<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" role="img" aria-label="Điểm trên đường x₂ = x₁ được dựng lại đúng; điểm lệch khỏi đường thì có lỗi." style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Điểm trên đường x₂ = x₁ được dựng lại đúng; điểm lệch khỏi đường thì có lỗi.</title><path d="M 170,224 L 380,14" fill="none" stroke="var(--t-n, #2f6587)" stroke-width="2" stroke-linecap="round"/><text x="386" y="14" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">x₂ = x₁</text><circle cx="275" cy="119" r="5.5" fill="var(--t-s, #4d7337)" fill-opacity="1" stroke="var(--t-s, #4d7337)" stroke-width="1.4"/><path d="M 267.5,186.5 L 237.5,156.5" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="237.5" cy="156.5" r="5" fill="var(--paper, var(--bg, #faf9f5))" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="1.8"/><circle cx="267.5" cy="186.5" r="5.5" fill="var(--accent, #c2603e)" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="1.4"/><circle cx="365" cy="29" r="5.5" fill="var(--t-s, #4d7337)" fill-opacity="1" stroke="var(--t-s, #4d7337)" stroke-width="1.4"/><text x="263" y="117" fill="var(--t-s, #4d7337)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">[1, 1]: lỗi 0</text><text x="279.5" y="190.5" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">[0.9, 0.1] → [0.5, 0.5]: lỗi 0.16</text><text x="353" y="27" fill="var(--t-s, #4d7337)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">[2.2, 2.2]: xa gốc, lỗi vẫn 0</text></svg>