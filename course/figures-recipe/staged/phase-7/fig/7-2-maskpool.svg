<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Mean pooling có mask trên hidden states đặt tay của bài: clip đầu có hai bước thật (1, 2), (3, 4); chia cho 2 bước thật ra (2, 3), chia cho cả 4 bước đã pad ra (1, 1.5).</title><text x="40" y="30" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">clip 1: hai bước thật, hai bước padding</text><rect x="40" y="46" width="72" height="32" rx="5" fill="var(--t-n, #2f6587)" fill-opacity="0.25" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="76" y="62.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">(1, 2)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="76" y="92" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">a = 1</text><rect x="120" y="46" width="72" height="32" rx="5" fill="var(--t-n, #2f6587)" fill-opacity="0.25" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="156" y="62.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">(3, 4)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="156" y="92" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">a = 1</text><rect x="200" y="46" width="72" height="32" rx="5" fill="var(--faint, #a19e94)" fill-opacity="0.1" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="236" y="62.5" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">(0, 0)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="236" y="92" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">a = 0</text><rect x="280" y="46" width="72" height="32" rx="5" fill="var(--faint, #a19e94)" fill-opacity="0.1" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="316" y="62.5" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">(0, 0)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="316" y="92" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">a = 0</text><text xml:space="preserve" style="font-variant-ligatures:none" x="400" y="56" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">chia cho 4:  (1, 1.5)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="400" y="82" fill="var(--t-s, #4d7337)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">chia cho 2:  (2, 3)</text><text x="320" y="140" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">chia cho số bước đã pad thì embedding phụ thuộc clip nào được ghép cùng batch</text><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="170" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">z = Σ a_t h_t / Σ a_t</text></svg>