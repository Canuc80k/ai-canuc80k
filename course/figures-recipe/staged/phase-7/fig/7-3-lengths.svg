<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" role="img" aria-label="Batch pad về T = 100: clip 1 giây chỉ có 25 bước thật, nên input_lengths đúng là 100 và 25; truyền 100 cho cả hai clip không báo lỗi nhưng bắt CTC giải thích cả phần pad." style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Batch pad về T = 100: clip 1 giây chỉ có 25 bước thật, nên input_lengths đúng là 100 và 25; truyền 100 cho cả hai clip không báo lỗi nhưng bắt CTC giải thích cả phần pad.</title><text x="98" y="47" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">clip 4 s</text><rect x="110" y="34" width="360" height="26" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.3" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="488" y="47.5" fill="var(--t-s, #4d7337)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">100</text><text x="98" y="97" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">clip 1 s</text><rect x="110" y="84" width="90" height="26" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.3" stroke="none" stroke-width="0"/><rect x="202" y="84" width="268" height="26" rx="4" fill="var(--faint, #a19e94)" fill-opacity="0.12" stroke="none" stroke-width="0"/><text x="333.2" y="97" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">75 bước pad</text><text xml:space="preserve" style="font-variant-ligatures:none" x="488" y="97.5" fill="var(--t-s, #4d7337)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">25</text><text xml:space="preserve" style="font-variant-ligatures:none" x="488" y="16" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">input_lengths</text><text x="320" y="150" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">truyền 100 cho clip 1 s thì alignment phải trải qua cả 75 bước pad</text></svg>