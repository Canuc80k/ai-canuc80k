t="400">1000</text><text x="490" y="214" fill="var(--faint, #a19e94)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">số frame</text><path d="M 90.0,24.0 L 250.0,184.0" fill="none" stroke="var(--accent, #c2603e)" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 90,39.2 L 490,39.2" fill="none" stroke="var(--t-n, #2f6587)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M 90,147.2 L 490,147.2" fill="none" stroke="var(--t-n, #2f6587)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text xml:space="preserve" style="font-variant-ligatures:none" x="498" y="39.2" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">float32</text><text xml:space="preserve" style="font-variant-ligatures:none" x="498" y="147.2" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">float64</text><text x="82" y="12" fill="var(--faint, #a19e94)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">log₁₀ của tích</text><text xml:space="preserve" style="font-variant-ligatures:none" x="314" y="104" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">log α ≈ −2303 ở frame 1000</text><text xml:space="preserve" style="font-variant-ligatures:none" x="314" y="116" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">vẫn biểu diễn được</text></svg>