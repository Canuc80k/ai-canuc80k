<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Decision stump ngưỡng 2.5: hai lá thuần, Gini sau chia bằng 0.</title><rect x="260" y="15" width="120" height="30" rx="7" fill="var(--surface, #ffffff)" fill-opacity="1" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2"/><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="30.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">x ≤ 2.5</text><path d="M 320,45 L 200,108" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2" stroke-linecap="round"/><rect x="138" y="108" width="124" height="44" rx="8" fill="var(--t-n, #2f6587)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text x="200" y="123" fill="var(--t-n, #2f6587)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="600">lớp 0</text><text xml:space="preserve" style="font-variant-ligatures:none" x="200" y="141" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">x = 1, 2</text><path d="M 320,45 L 440,108" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2" stroke-linecap="round"/><rect x="378" y="108" width="124" height="44" rx="8" fill="var(--accent, #c2603e)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text x="440" y="123" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="600">lớp 1</text><text xml:space="preserve" style="font-variant-ligatures:none" x="440" y="141" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">x = 3, 4</text><text x="250" y="72" fill="var(--faint, #a19e94)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">có</text><text x="390" y="72" fill="var(--faint, #a19e94)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">không</text></svg>