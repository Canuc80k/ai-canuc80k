<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" role="img" aria-label="Gấp đôi batch và gấp đôi cạnh ảnh thì input gấp 8 lần." style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Gấp đôi batch và gấp đôi cạnh ảnh thì input gấp 8 lần.</title><rect x="220" y="26" width="330" height="26" rx="3" fill="var(--t-n, #2f6587)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text x="210" y="39" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">trọng số 100 triệu, FP32</text><text xml:space="preserve" style="font-variant-ligatures:none" x="558" y="39" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">381.47 MiB</text><rect x="220" y="66" width="164.996" height="26" rx="3" fill="var(--t-n, #2f6587)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text x="210" y="79" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">trọng số 100 triệu, FP16</text><text xml:space="preserve" style="font-variant-ligatures:none" x="392.996" y="79" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">190.73 MiB</text><rect x="220" y="106" width="7.95004" height="26" rx="3" fill="var(--accent, #c2603e)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text x="210" y="119" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">input 16 × 3 × 224²</text><text xml:space="preserve" style="font-variant-ligatures:none" x="235.95" y="119" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">9.19 MiB</text><rect x="220" y="146" width="63.583" height="26" rx="3" fill="var(--accent, #c2603e)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text x="210" y="159" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">input 32 × 3 × 448²</text><text xml:space="preserve" style="font-variant-ligatures:none" x="291.583" y="159" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">73.5 MiB</text><text x="320" y="188" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">chưa tính activation, gradient, optimizer và bộ nhớ dự trữ</text></svg>