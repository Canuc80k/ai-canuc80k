<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Ba lần mất giờ trong nhật ký: hai lỗi quy trình (35 và 20 phút) chiếm 55 trên 60 phút, lỗi kiến thức chỉ 5 phút; việc luyện tiếp nên bắt đầu từ quy trình.</title><text x="170" y="43" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">hàm tự viết khi nạp</text><rect x="184" y="30" width="315" height="26" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.45" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="507" y="43.5" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="600">35 phút</text><text x="569" y="43" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">quy trình</text><text x="170" y="85" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">đảo thứ tự cột</text><rect x="184" y="72" width="180" height="26" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.45" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="372" y="85.5" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="600">20 phút</text><text x="434" y="85" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">quy trình</text><text x="170" y="127" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">nhầm hướng metric</text><rect x="184" y="114" width="45" height="26" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.45" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="237" y="127.5" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="600">5 phút</text><text x="299" y="127" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">kiến thức</text><text x="320" y="172" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">quy trình 55 trên 60 phút: luyện nạp ở môi trường trống và readback trước</text></svg>