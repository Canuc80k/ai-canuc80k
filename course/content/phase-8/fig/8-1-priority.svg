<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Xếp ba việc theo điểm dự kiến mỗi phút: sửa schema 0.72, model mới 0.15, thêm seed 0.07.</title><text x="130" y="48" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">sửa schema</text><rect x="146" y="34" width="300" height="28" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.4" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="454" y="48.5" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">0.72</text><text xml:space="preserve" style="font-variant-ligatures:none" x="498" y="48.5" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">= 0.9 × 8 / 10</text><text x="130" y="96" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">model mới</text><rect x="146" y="82" width="62.5" height="28" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.25" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="216.5" y="96.5" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">0.15</text><text xml:space="preserve" style="font-variant-ligatures:none" x="260.5" y="96.5" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">= 0.3 × 20 / 40</text><text x="130" y="144