<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Đường chạy của bài: fit pipeline, lưu artifact, nạp ở một tiến trình mới, dự đoán với cột chọn theo tên, ghi CSV rồi đọc lại, cuối cùng ghi hash của đúng file sẽ nộp.</title><rect x="14" y="40" width="92" height="52" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.15" stroke="none" stroke-width="0"/><text x="60" y="58" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">fit</text><text x="60" y="77" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="10.5" font-weight="400">pipeline</text><path d="M 107,66 L 117,66" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" stroke-linecap="round"/><path d="M 109.695,69.2621 L 117,66 L 109.695,62.7379" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="118" y="40" width="92" height="52" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.15" stroke="none" stroke-width="0"/><text x="164" y="58" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">lưu</text><text x="164" y="77" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="10.5" font-weight="400">artifact</text><path d="M 211,66 L 221,66" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" stroke-linecap="round"/><path d="M 213.695,69.2621 L 221,66 L 213.695,62.7379" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="222" y="40" width="92" he