<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Pickle chỉ lưu tên hàm, không lưu thân hàm; máy chấm không có hàm ấy nên lỗi.</title><rect x="20" y="30" width="200" height="120" rx="8" fill="var(--t-n, #2f6587)" fill-opacity="0.12" stroke="none" stroke-width="0"/><text x="120" y="48" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">tiến trình tạo file</text><text xml:space="preserve" style="font-variant-ligatures:none" x="36" y="76" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">def clip_log(v):</text><text xml:space="preserve" style="font-variant-ligatures:none" x="50" y="94" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">return np.log1p(...)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="36" y="122" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">pickle.dumps(step)</text><rect x="250" y="62" width="140" height="56" rx="6" fill="#b8892b" fill-opacity="0.3" stroke="none" stroke-width="0"/><text x="320" y="50" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">bytes trong pickle</text><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="82" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">__main__.clip_log</text><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="102" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">không có log1p</text><path d="M 222,90 L 248,90" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" stroke-linecap="round"/><path d="M 240.695,93.2621 L 248,90 L 240.695,86.7379" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 392,90 L 418,90" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" stroke-linecap="round"/><path d="M 410.695,93.2621 L 418,90 L 410.695,86.7379" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="30" width="200" height="120" rx="8" fill="var(--accent, #c2603e)" fill-opacity="0.12" stroke="none" stroke-width="0"/><text x="520" y="48" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">tiến trình máy chấm</text><text xml:space="preserve" style="font-variant-ligatures:none" x="436" y="82" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">pickle.loads(...)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="436" y="104" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="600">AttributeError:</text><text xml:space="preserve" style="font-variant-ligatures:none" x="436" y="122" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">no 'clip_log'</text><text x="320" y="182" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">pickle ghi tên hàm, không ghi thân hàm</text></svg>