<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Chọn X vì hiệu quả nhất lại thừa 10 phút vô ích; làm Y rồi Z được nhiều điểm hơn.</title><text x="98" y="55" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">theo V: X</text><rect x="111" y="40" width="238" height="30" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="230" y="55.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">X</text><rect x="351" y="40" width="118" height="30" rx="4" fill="none" fill-opacity="1" stroke="var(--faint, #a19e94)" stroke-width="1" stroke-dasharray="3 3"/><text x="410" y="55" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="10.5" font-weight="400">10 phút thừa</text><text xml:space="preserve" style="font-variant-ligatures:none" x="484" y="55.5" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">0.5 × 40 = 20</text><text x="98" y="111" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">Y rồi Z</text><rect x="111" y="96" width="178" height="30" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="200" y="111.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">Y</text><rect x="291" y="96" width="178" height="30" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="380" y="111.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">Z</text><text xml:space="preserve" style="font-variant-ligatures:none" x="484" y="111.5" fill="var(--t-s, #4d7337)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">2 × 0.8 × 15 = 24</text><text xml:space="preserve" style="font-variant-ligatures:none" x="110" y="160" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10" font-weight="400">0</text><text xml:space="preserve" style="font-variant-ligatures:none" x="290" y="160" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10" font-weight="400">15</text><text xml:space="preserve" style="font-variant-ligatures:none" x="470" y="160" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10" font-weight="400">30</text><text xml:space="preserve" style="font-variant-ligatures:none" x="484" y="160" fill="var(--faint, #a19e94)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10" font-weight="400">phút</text></svg>