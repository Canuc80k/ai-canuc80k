<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Chỉ khi có cả lọc mềm lẫn truy vấn cân đối, số lượt mới giảm rõ.</title><text x="330" y="22" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">điểm (ván thua tính 9 lượt), thấp là tốt</text><text x="580" y="22" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">giải được</text><text x="140" y="52" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">quét 0..7</text><rect x="154" y="38" width="315" height="28" rx="4" fill="var(--faint, #a19e94)" fill-opacity="0.45" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="477" y="52.5" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">4.50</text><text xml:space="preserve" style="font-variant-ligatures:none" x="610" y="52.5" fill="var(--muted, #73716a)" text-anchor="end" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">100%</text><text x="140" y="98" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">cứng + cân đối</text><rect x="154" y="84" width="344.4" height="28" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.45" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="506.4" y="98.5" fill="currentColor" text-anchor="start" dominant-baseline="middle