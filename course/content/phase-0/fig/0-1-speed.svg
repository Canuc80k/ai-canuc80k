<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Cùng một tổng của 500 000 số, đo trên một máy CPU.</title><text x="10.5" y="31" fill="currentColor" dominant-baseline="middle" xml:space="preserve" style="font-variant-ligatures:none" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5"><tspan fill="var(--t-k, #9a4528)">for</tspan> i <tspan fill="var(--t-k, #9a4528)">in</tspan> range(n): s += i</text><rect x="210" y="18" width="281.16" height="26" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.8" stroke="none" stroke-width="0"/><text x="499.16" y="31" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13.5" font-weight="400">17.04 ms</text><text x="100.5" y="71" fill="currentColor" dominant-baseline="middle" xml:space="preserve" style="font-variant-ligatures:none" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5">sum(range(n))</text><rect x="210" y="58" width="109.395" height="26" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.8" stroke="none" stroke-width="0"/><text x="327.395" y="71" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13.5" font-weight="400">6.63 ms</text><text x="63" y="111" fill="currentColor" dominant-baseline="middle" xml:space="preserve" style="font-variant-ligatures:none" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5">np.arange(n).sum()</text><rect x="210" y="98" width="4.29" height="26" rx="4" fill="var(--t-s, #4d7337)" fill-opacity="0.8" stroke="none" stroke-width="0"/><text x="222.29" y="111" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13.5" font-weight="400">0.26 ms</text><text x="210" y="142" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">0</text><text x="292.5" y="142" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">5</text><text x="375" y="142" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">10</text><text x="457.5" y="142" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">15</text><text x="540" y="142" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">20</text><text x="556" y="142" fill="var(--faint, #a19e94)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">ms</text></svg>