<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 176" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Đạo hàm của loss theo w bằng tích đạo hàm của từng bước.</title><rect x="35" y="54" width="50" height="44" rx="8" fill="var(--surface, #ffffff)" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1.4"/><text x="60" y="76" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--serif, Lora, Georgia, serif)' font-size="16" font-weight="400">w</text><text x="60" y="116" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="400">w = 1</text><rect x="220" y="54" width="110" height="44" rx="8" fill="var(--surface, #ffffff)" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1.4"/><text x="275" y="76" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--serif, Lora, Georgia, serif)' font-size="16" font-weight="400">ŷ = wx</text><text x="275" y="116" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="400">ŷ = 2</text><rect x="460" y="54" width="140" height="44" rx="8" fill="var(--surface, #ffffff)" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1.4"/><text x="530" y="76" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--serif, Lora, Georgia, serif)' font-size="16" font-weight="400">L = (ŷ − y)²</text><text x="530" y="116" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="400">L = 16</text><path d="M 90,76 L 214,76" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.4" stroke-linecap="round"/><path d="M 206.695,79.2621 L 214,76 L 206.695,72.7379" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 336,76 L 454,76" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.4" stroke-linecap="round"/><path d="M 446.695,79.2621 L 454,76 L 446.695,72.7379" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="152" y="42" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="600">∂ŷ/∂w = x = 2</text><text x="395" y="42" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="600">∂L/∂ŷ = 2(ŷ − y) = −8</text><text x="320" y="156" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="14" font-weight="700">∂L/∂w = 2 · (−8) = −16</text></svg>