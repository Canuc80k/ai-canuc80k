<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" role="img" aria-label="Sau shift(1), lag và rolling chỉ dùng giờ trước giờ cần dự đoán." style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Sau shift(1), lag và rolling chỉ dùng giờ trước giờ cần dự đoán.</title><text x="150" y="20" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">giờ 1</text><text x="270" y="20" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">giờ 2</text><text x="390" y="20" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">giờ 3 (cần dự đoán)</text><rect x="118" y="36" width="64" height="34" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="150" y="53.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">5</text><rect x="238" y="36" width="64" height="34" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="270" y="53.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">7</text><rect x="358" y="36" width="64" height="34" rx="6" fill="var(--accent, #c2603e)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="390" y="53.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">6</text><path d="M 240,104 L 300,104" fill="none" stroke="var(--t-s, #4d7337)" stroke-width="2.4" stroke-linecap="round"/><path d="M 240,98 L 240,110" fill="none" stroke="var(--t-s, #4d7337)" stroke-width="2" stroke-linecap="round"/><path d="M 300,98 L 300,110" fill="none" stroke="var(--t-s, #4d7337)" stroke-width="2" stroke-linecap="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="470" y="104" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">lag_1 = 7</text><text x="110" y="104" fill="var(--t-s, #4d7337)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">đúng</text><path d="M 120,144 L 300,144" fill="none" stroke="var(--t-s, #4d7337)" stroke-width="2.4" stroke-linecap="round"/><path d="M 120,138 L 120,150" fill="none" stroke="var(--t-s, #4d7337)" stroke-width="2" stroke-linecap="round"/><path d="M 300,138 L 300,150" fill="none" stroke="var(--t-s, #4d7337)" stroke-width="2" stroke-linecap="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="470" y="144" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">shift(1).rolling(2) = 6</text><text x="110" y="144" fill="var(--t-s, #4d7337)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">đúng</text><path d="M 240,184 L 420,184" fill="none" stroke="var(--accent, #c2603e)" stroke-width="2.4" stroke-linecap="round"/><path d="M 240,178 L 240,190" fill="none" stroke="var(--accent, #c2603e)" stroke-width="2" stroke-linecap="round"/><path d="M 420,178 L 420,190" fill="none" stroke="var(--accent, #c2603e)" stroke-width="2" stroke-linecap="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="470" y="184" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">rolling(2) = 6.5</text><text x="110" y="184" fill="var(--accent, #c2603e)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">sai: chứa target</text></svg>