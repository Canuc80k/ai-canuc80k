<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Bộ nhớ của attention score tỉ lệ với L²: gấp đôi L, gấp bốn bộ nhớ.</title><rect x="160" y="40" width="384" height="32" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="150" y="56" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">L = 1024</text><text xml:space="preserve" style="font-variant-ligatures:none" x="552" y="56" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">512 MiB</text><rect x="160" y="96" width="96" height="32" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="150" y="112" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">L = 512</text><text xml:space="preserve" style="font-variant-ligatures:none" x="264" y="112" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">128 MiB</text><text x="320" y="166" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">score (16, 8, L, L) FP32: L giảm một nửa, bộ nhớ giảm bốn lần</text></svg>