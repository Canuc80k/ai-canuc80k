<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Độ dài gấp 16 thì số ô của ma trận score gấp 256.</title><rect x="150" y="24" width="1.5" height="22" rx="3" fill="var(--accent, #c2603e)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="140" y="35" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">L = 128</text><text xml:space="preserve" style="font-variant-ligatures:none" x="159.5" y="35" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">0.02 triệu ô</text><rect x="150" y="54" width="5.9375" height="22" rx="3" fill="var(--accent, #c2603e)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="140" y="65" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">L = 256</text><text xml:space="preserve" style="font-variant-ligatures:none" x="163.938" y="65" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">0.07 triệu ô</text><rect x="150" y="84" width="23.75" height="22" rx="3" fill="var(--accent, #c2603e)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="140" y="95" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">L = 512</text><text xml:space="preserve" style="font-variant-ligatures:none" x="181.75" y="95" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">0.26 triệu ô</text><rect x="150" y="114" width="95" height="22" rx="3" fill="var(--accent, #c2603e)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="140" y="125" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">L = 1024</text><text xml:space="preserve" style="font-variant-ligatures:none" x="253" y="125" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">1.05 triệu ô</text><rect x="150" y="144" width="380" height="22" rx="3" fill="var(--accent, #c2603e)" fill-opacity="0.7" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="140" y="155" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">L = 2048</text><text xml:space="preserve" style="font-variant-ligatures:none" x="538" y="155" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">4.19 triệu ô</text><text x="320" y="186" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">số ô score L × L của một head, một câu: L gấp đôi thì gấp bốn</text></svg>