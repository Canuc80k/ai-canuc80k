<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640" role="img" aria-label="GradScaler nhân gradient lên để không bị làm tròn về 0 trong FP16." style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>GradScaler nhân gradient lên để không bị làm tròn về 0 trong FP16.</title><rect x="150.29" y="60" width="391.239" height="40" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.12" stroke="none" stroke-width="0"/><text x="345.909" y="46" fill="var(--t-n, #2f6587)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">khoảng FP16 biểu diễn được</text><text x="60" y="118" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁻¹⁰</text><text x="125" y="118" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁻⁸</text><text x="190" y="118" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁻⁶</text><text x="255" y="118" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁻⁴</text><text x="320" y="118" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁻²</text><text x="385" y="118" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁰</text><text x="450" y="118" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10²</text><text x="515" y="118" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁴</text><text x="580" y="118" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁶</text><path d="M 60,100 L 580,100" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1" stroke-linecap="round"/><circle cx="125" cy="80" r="6" fill="var(--accent, #c2603e)" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="1.4"/><text xml:space="preserve" style="font-variant-ligatures:none" x="125" y="140" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">1e-8 → 0</text><path d="M 125,72 Q 203.264,32.868 281.528,72" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 273.535,71.6509 L 281.528,72 L 276.453,65.8155" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="281.528" cy="80" r="6" fill="var(--t-s, #4d7337)" fill-opacity="1" stroke="var(--t-s, #4d7337)" stroke-width="1.4"/><text xml:space="preserve" style="font-variant-ligatures:none" x="281.528" y="140" fill="var(--t-s, #4d7337)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">× 65536 = 6.55e-4</text></svg>