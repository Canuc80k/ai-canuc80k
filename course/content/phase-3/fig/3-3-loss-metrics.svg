<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Phần dư 1, 2, 10 của ví dụ: bình phương biến chúng thành diện tích 1, 4, 100, nên một mẫu đóng gần hết MSE = 35.</title><rect x="60" y="147" width="13" height="13" rx="2" fill="var(--t-n, #2f6587)" fill-opacity="0.15" stroke="var(--t-n, #2f6587)" stroke-width="1.2"/><path d="M 60,170 L 73,170" fill="none" stroke="var(--t-n, #2f6587)" stroke-width="1.4" stroke-linecap="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="66.5" y="184" fill="var(--t-n, #2f6587)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">r = 1</text><text xml:space="preserve" style="font-variant-ligatures:none" x="81" y="157" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="600">1</text><rect x="130" y="134" width="26" height="26" rx="2" fill="var(--t-n, #2f6587)" fill-opacity="0.15" stroke="var(--t-n, #2f6587)" stroke-width="1.2"/><path d="M 130,170 L 156,170" fill="none" stroke="var(--t-n, #2f6587)" stroke-width="1.4" stroke-linecap="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="143" y="184" fill="var(--t-n, #2f6587)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">r = 2</text><text xml:space="preserve" style="font-variant-ligatures:none" x="164" y="144" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="600">4</text><rect x="230" y="30" width="130" height="130" rx="2" fill="var(--accent, #c2603e)" fill-opacity="0.15" stroke="var(--accent, #c2603e)" stroke-width="1.2"/><path d="M 230,170 L 360,170" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.4" stroke-linecap="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="295" y="184" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">r = 10</text><text xml:space="preserve" style="font-variant-ligatures:none" x="368" y="40" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="600">100</text><text xml:space="preserve" style="font-variant-ligatures:none" x="420" y="100" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">MSE = (1 + 4 + 100)/3 = 35</text></svg>