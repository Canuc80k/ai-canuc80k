<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Forward 2 → 6 → 25; backward nhân đạo hàm cục bộ: 10 × 3 = 30.</title><circle cx="90" cy="74" r="24" fill="var(--surface, #ffffff)" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1.6"/><text xml:space="preserve" style="font-variant-ligatures:none" x="90" y="74.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">2</text><text xml:space="preserve" style="font-variant-ligatures:none" x="90" y="36" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">w</text><circle cx="320" cy="74" r="24" fill="var(--surface, #ffffff)" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1.6"/><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="74.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">6</text><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="36" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">u = 3w</text><circle cx="550" cy="74" r="24" fill="var(--surface, #ffffff)" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="1.6"/><text xml:space="preserve" style="font-variant-ligatures:none" x="550" y="74.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">25</text><text xml:space="preserve" style="font-variant-ligatures:none" x="550" y="36" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">J = (u − 1)²</text><path d="M 118,74 L 292,74" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.4" stroke-linecap="round"/><path d="M 284.695,77.2621 L 292,74 L 284.695,70.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="205" y="62" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">× 3</text><path d="M 348,74 L 522,74" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.4" stroke-linecap="round"/><path d="M 514.695,77.2621 L 522,74 L 514.695,70.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="435" y="62" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">(·−1)²</text><path d="M 540,150 L 330,150" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.6" stroke-linecap="round"/><path d="M 337.305,146.738 L 330,150 L 337.305,153.262" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.6" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="435" y="138" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">dJ/du = 2(u − 1) = 10</text><path d="M 310,150 L 100,150" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.6" stroke-linecap="round"/><path d="M 107.305,146.738 L 100,150 L 107.305,153.262" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.6" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="205" y="138" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">du/dw = 3</text><text xml:space="preserve" style="font-variant-ligatures:none" x="90" y="172" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="14" font-weight="600">30</text><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="172" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="14" font-weight="600">10</text><text xml:space="preserve" style="font-variant-ligatures:none" x="550" y="172" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="14" font-weight="600">1</text><text xml:space="preserve" style="font-variant-ligatures:none" x="90" y="194" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">dJ/dw = 10 × 3 = 30</text></svg>