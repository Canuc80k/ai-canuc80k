roke-width="6" stroke-linecap="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="116" y="125.625" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">g = 100</text><text x="480" y="60" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">SGD: ηg</text><text x="480" y="80" fill="var(--t-s, #4d7337)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">Adam bước đầu: ≈ η</text></svg>