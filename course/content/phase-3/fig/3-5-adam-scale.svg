<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Gradient 0.01, 1 hay 100: bước SGD tỉ lệ với g, còn bước đầu của Adam luôn dài cỡ η = 0.1 vì gradient đã được chia cho độ lớn của chính nó.</title><path d="M 130,20 L 130,150" fill="none" stroke="var(--line, #e6e2d6)" stroke-width="0.8" stroke-linecap="round"/><text x="130" y="164" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁻⁴</text><path d="M 182.381,20 L 182.381,150" fill="none" stroke="var(--line, #e6e2d6)" stroke-width="0.8" stroke-linecap="round"/><text x="182.381" y="164" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁻³</text><path d="M 234.762,20 L 234.762,150" fill="none" stroke="var(--line, #e6e2d6)" stroke-width="0.8" stroke-linecap="round"/><text x="234.762" y="164" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁻²</text><path d="M 287.143,20 L 287.143,150" fill="none" stroke="var(--line, #e6e2d6)" stroke-width="0.8" stroke-linecap="round"/><text x="287.143" y="164" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁻¹</text><path d="M 339.524,20 L 339.524,150" fill="none" stroke="var(--line, #e6e2d6)" stroke-width="0.8" stroke-linecap="round"/><text x="339.524" y="164" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">10⁰</text><path d="M 391.905,20 L 391.905,150" fill="none" stroke="var(--line, #e