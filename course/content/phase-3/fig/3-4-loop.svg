<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Mỗi batch: zero_grad → forward → loss → backward → step.</title><rect x="20" y="60" width="100" height="44" rx="10" fill="var(--t-n, #2f6587)" fill-opacity="0.15" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="70" y="82.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="600">zero_grad</text><text x="70" y="44" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">.grad = None</text><path d="M 122,82 L 143,82" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" stroke-linecap="round"/><path d="M 135.695,85.2621 L 143,82 L 135.695,78.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="145" y="60" width="100" height="44" rx="10" fill="var(--t-n, #2f6587)" fill-opacity="0.15" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="195" y="82.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="600">forward</text><text x="195" y="44" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">logits</text><path d="M 247,82 L 268,82" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" stroke-linecap="round"/><path d="M 260.695,85.2621 L 268,82 L 260.695,78.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="270" y="60" width="100" height="44" rx="10" fill="var(--t-n, #2f6587)" fill-opacity="0.15" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="82.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="600">loss</text><text x="320" y="44" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">một số</text><path d="M 372,82 L 393,82" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" stroke-linecap="round"/><path d="M 385.695,85.2621 L 393,82 L 385.695,78.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="395" y="60" width="100" height="44" rx="10" fill="var(--accent, #c2603e)" fill-opacity="0.15" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="445" y="82.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="600">backward</text><text x="445" y="44" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">.grad mới</text><path d="M 497,82 L 518,82" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" stroke-linecap="round"/><path d="M 510.695,85.2621 L 518,82 L 510.695,78.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="60" width="100" height="44" rx="10" fill="var(--accent, #c2603e)" fill-opacity="0.15" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="570" y="82.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="600">step</text><text x="570" y="44" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">θ thay đổi</text><path d="M 570,106 Q 320,156 70,106" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 77.8026,104.234 L 70,106 L 76.5231,110.631" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="168" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">batch tiếp theo</text><text x="320" y="198" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">đổi thứ tự backward / zero_grad / step là mất hoặc dùng sai gradient</text></svg>