<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Forward 2 → 1 → 2 → 4; backward nhân dần 4 → 8 → 16.</title><circle cx="70" cy="70" r="22" fill="var(--surface, #ffffff)" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1.6"/><text xml:space="preserve" style="font-variant-ligatures:none" x="70" y="70.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">2</text><text xml:space="preserve" style="font-variant-ligatures:none" x="70" y="34" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">x</text><circle cx="230" cy="70" r="22" fill="var(--surface, #ffffff)" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1.6"/><text xml:space="preserve" style="font-variant-ligatures:none" x="230" y="70.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">1</text><text xml:space="preserve" style="font-variant-ligatures:none" x="230" y="34" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">h = ReLU(0.5x)</text><circle cx="390" cy="70" r="22" fill="var(--surface, #ffffff)" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1.6"/><text xml:space="preserve" style="font-variant-ligatures:none" x="390" y="70.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">2</text><text xml:space="preserve" style="font-variant-ligatures:none" x="390" y="34" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">p = 2h</text><circle cx="550" cy="70" r="22" fill="var(--surface, #ffffff)" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="1.6"/><text xml:space="preserve" style="font-variant-ligatures:none" x="550" y="70.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">4</text><text xml:space="preserve" style="font-variant-ligatures:none" x="550" y="34" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">J = (p − 0)²</text><path d="M 96,70 L 204,70" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" stroke-linecap="round"/><path d="M 196.695,73.2621 L 204,70 L 196.695,66.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 256,70 L 364,70" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" stroke-linecap="round"/><path d="M 356.695,73.2621 L 364,70 L 356.695,66.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 416,70 L 524,70" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" stroke-linecap="round"/><path d="M 516.695,73.2621 L 524,70 L 516.695,66.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="70" y="160" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="16" font-weight="600">16</text><text xml:space="preserve" style="font-variant-ligatures:none" x="70" y="184" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">dJ/dw₁</text><text xml:space="preserve" style="font-variant-ligatures:none" x="230" y="160" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="16" font-weight="600">8</text><text xml:space="preserve" style="font-variant-ligatures:none" x="230" y="184" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">dJ/dh</text><text xml:space="preserve" style="font-variant-ligatures:none" x="390" y="160" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="16" font-weight="600">4</text><text xml:space="preserve" style="font-variant-ligatures:none" x="390" y="184" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">dJ/dp</text><path d="M 368,160 L 252,160" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.5" stroke-linecap="round"/><path d="M 259.305,156.738 L 252,160 L 259.305,163.262" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="310" y="146" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">× w₂ = 2</text><path d="M 208,160 L 92,160" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.5" stroke-linecap="round"/><path d="M 99.3047,156.738 L 92,160 L 99.3047,163.262" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="150" y="146" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">× x = 2 (ReLU mở)</text><path d="M 550,94 L 410,152" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.5" stroke-linecap="round"/><path d="M 415.5,146.19 L 410,152 L 417.997,152.218" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="500" y="136" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">2(p − y)</text></svg>