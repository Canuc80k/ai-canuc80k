<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Ba mức kiểm output: cú pháp JSON, schema, nội dung.</title><rect x="40" y="30" width="220" height="44" rx="7" fill="var(--t-n, #2f6587)" fill-opacity="0.22" stroke="none" stroke-width="0"/><text x="50" y="45" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="600">1. cú pháp</text><text x="50" y="62" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">json.loads đọc được</text><text xml:space="preserve" style="font-variant-ligatures:none" x="290" y="52" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">Đây là kết quả: {…}</text><rect x="70" y="88" width="190" height="44" rx="7" fill="#b8892b" fill-opacity="0.22" stroke="none" stroke-width="0"/><text x="80" y="103" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="600">2. schema</text><text x="80" y="120" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">đúng khóa, kiểu, miền</text><text xml:space="preserve" style="font-variant-ligatures:none" x="290" y="110" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">{"students": "18", …}</text><rect x="100" y="146" width="160" height="44" rx="7" fill="var(--accent, #c2603e)" fill-opacity="0.22" stroke="none" stroke-width="0"/><text x="110" y="161" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="600">3. nội dung</text><text x="110" y="178" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">khớp gold từ nguồn</text><text xml:space="preserve" style="font-variant-ligatures:none" x="290" y="168" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">{"date": "20/10", …} (kế hoạch cũ)</text><text x="290" y="16" fill="var(--faint, #a19e94)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">ví dụ trượt ở mức này</text><text x="320" y="206" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">qua mức trên chưa chắc qua mức dưới: prompt injection qua được cả hai mức đầu</text></svg>