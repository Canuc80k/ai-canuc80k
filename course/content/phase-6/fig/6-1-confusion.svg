<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Confusion matrix của baseline trên sáu câu validation (số từ code bài): hai ô lệch là hai câu chứa “không”, mỗi câu đoán ngược một chiều.</title><rect x="250" y="50" width="70" height="50" rx="4" fill="var(--t-s, #4d7337)" fill-opacity="0.3" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="285" y="75.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="16" font-weight="400">2</text><rect x="326" y="50" width="70" height="50" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.25" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="361" y="75.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="16" font-weight="400">1</text><rect x="250" y="106" width="70" height="50" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.25" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="285" y="131.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="16" font-weight="400">1</text><rect x="326" y="106" width="70" height="50" rx="4" fill="var(--t-s, #4d7337)" fill-opacity="0.3" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="361" y="131.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="16" font-weight="400">2</text><text x="285" y="36" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">đoán 0</text><text x="361" y="36" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">đoán 1</text><text x="240" y="75" fill="var(--muted, #73716a)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">thật 0</text><text x="240" y="131" fill="var(--muted, #73716a)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">thật 1</text><text x="470" y="70" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">“bài giảng không hay”</text><text x="470" y="126" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">“khóa học không tệ”</text><path d="M 396,75 L 466,70" fill="none" stroke="var(--faint, #a19e94)" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><path d="M 396,131 L 466,126" fill="none" stroke="var(--faint, #a19e94)" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="320" y="186" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">accuracy 4/6 = 0.667, macro-F1 0.667</text></svg>