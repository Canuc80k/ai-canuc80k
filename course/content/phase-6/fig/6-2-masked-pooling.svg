<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Mean pooling trên hidden state đặt tay của bài: hai token thật (2, 0), (0, 2) và hai vị trí padding (9, 9); có mask ra (1, 1), lấy trung bình cả padding bị kéo về (5, 5).</title><rect x="30" y="40" width="80" height="34" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.2" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="70" y="57.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">(2, 0)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="70" y="94" fill="var(--t-s, #4d7337)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">mask 1</text><rect x="120" y="40" width="80" height="34" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.2" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="160" y="57.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">(0, 2)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="160" y="94" fill="var(--t-s, #4d7337)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">mask 1</text><rect x="210" y="40" width="80" height="34" rx="6" fill="var(--faint, #a19e94)" fill-opacity="0.1" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="250" y="57.5" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">(9, 9)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="250" y="94" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">mask 0</text><rect x="300" y="40" width="80" height="34" rx="6" fill="var(--faint, #a19e94)" fill-opacity="0.1" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="340" y="57.5" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">(9, 9)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="340" y="94" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">mask 0</text><text x="205" y="24" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">hidden state của 4 vị trí</text><text x="540" y="52" fill="var(--muted, #73716a)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">mean cả 4:</text><text xml:space="preserve" style="font-variant-ligatures:none" x="548" y="52" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="600">(5, 5)</text><text x="540" y="84" fill="var(--muted, #73716a)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">mean có mask:</text><text xml:space="preserve" style="font-variant-ligatures:none" x="548" y="84" fill="var(--t-s, #4d7337)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="600">(1, 1)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="150" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">Σ mᵢ hᵢ / Σ mᵢ = ((2, 0) + (0, 2)) / 2</text><text x="320" y="182" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">padding không được giả định bằng 0: hidden state ở đó có thể là bất cứ gì</text></svg>