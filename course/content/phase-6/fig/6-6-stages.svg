<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Từ base model đến instruct model: pretraining dạy đoán token kế tiếp; post-training gồm SFT trên cặp chỉ dẫn – trả lời mẫu rồi thường tối ưu theo ưu tiên bằng RLHF hoặc DPO.</title><rect x="20" y="60" width="106" height="56" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.16" stroke="none" stroke-width="0"/><text x="73" y="80" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">pretraining</text><text x="73" y="98" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="10.5" font-weight="400">đoán token kế</text><text x="73" y="112" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="10.5" font-weight="400">trên kho văn bản lớn</text><rect x="144" y="60" width="106" height="56" rx="8" fill="var(--faint, #a19e94)" fill-opacity="0.28" stroke="none" stroke-width="0"/><text x="197" y="80" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">base model</text><text x="197" y="98" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="10.5" font-weight="400">biết viết tiếp</text><path d="M 128,88 L 142,88" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.1" stroke-linecap="round"/><path d="M 134.695,91.2621 L 142,88 L 134.695,84.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.1" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="268" y="60" width="106" height="56" rx="4" fill="v