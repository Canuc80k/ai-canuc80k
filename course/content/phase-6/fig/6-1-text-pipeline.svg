<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Chuẩn hóa văn bản, TF-IDF fit trên train, rồi logistic regression.</title><rect x="20" y="40" width="140" height="40" rx="8" fill="var(--faint, #a19e94)" fill-opacity="0.18" stroke="none" stroke-width="0"/><text x="90" y="60" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="400">“bài học hay”</text><path d="M 164,60 L 196,60" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2" stroke-linecap="round"/><path d="M 188.695,63.2621 L 196,60 L 188.695,56.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="200" y="40" width="120" height="40" rx="8" fill="var(--t-n, #2f6587)" fill-opacity="0.16" stroke="none" stroke-width="0"/><text x="260" y="60" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">NFC, viết thường</text><path d="M 324,60 L 356,60" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2" stroke-linecap="round"/><path d="M 348.695,63.2621 L 356,60 L 348.695,56.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="40" width="120" height="40" rx="8" fill="var(--t-n, #2f6587)" fill-opacity="0.22" stroke="none" stroke-width="0"/><text x="420" y="54" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="600">TF-IDF</text><text xml:space="preserve" style="font-variant-ligatures:none" x="420" y="70" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family=