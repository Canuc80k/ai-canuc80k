<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>NLL từng token của ba câu probe dưới bigram add-1 (số từ code bài): “em học toán” có PPL 3.785; đảo trật tự thành “em sách học” lên 8.629; từ lạ “robot” bị đổi thành UNK cho 6.557.</title><path d="M 170,200 L 530,200" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1" stroke-linecap="round"/><text x="170" y="214" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">0</text><text x="290" y="214" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">3</text><text x="410" y="214" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">6</text><text x="530" y="214" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">9</text><rect x="170.5" y="45.3333" width="49.1105" height="26" rx="2" fill="var(--t-n, #2f6587)" fill-opacity="0.45" stroke="none" stroke-width="0"/><rect x="220.611" y="45.3333" width="54.4518" height="26" rx="2" fill="var(--t-s, #4d7337)" fill-opacity="0.45" stroke="none" stroke-width="0"/><rect x="276.062" y="45.3333" width="54.4518" height="26" rx="2" fill="#b8892b" fill-opacity="0.45" stroke="none" stroke-width="0"/><rect x="331.514" y="45.3333" width="50.9713" height="26" rx="2" fill="var(--accent, #c2603e)" fill-opacity="0.45" stroke="none" stroke-width="0"/><text x="160" y="52.3333" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight