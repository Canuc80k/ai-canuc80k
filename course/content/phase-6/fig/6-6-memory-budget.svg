<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>KV cache tăng tuyến tính theo batch và độ dài: 12 MiB thành 96 MiB.</title><text x="210" y="54" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">B=1, L=1024, h=2</text><rect x="220" y="40" width="40.8" height="28" rx="3" fill="var(--t-s, #4d7337)" fill-opacity="0.55" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="266.8" y="54.5" fill="var(--t-s, #4d7337)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">12 MiB</text><text x="210" y="100" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">B=4, L=2048, h=2</text><rect x="220" y="86" width="326.4" height="28" rx="3" fill="var(--t-n, #2f6587)" fill-opacity="0.55" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="552.4" y="100.5" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">96 MiB</text><text xml:space="preserve" style="font-variant-ligatures:none" x="320" y="150" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">KV bytes ≈ 2·B·L·n·h·d_h·b  (n = 24, d_h = 64, b = 2)</text></svg>