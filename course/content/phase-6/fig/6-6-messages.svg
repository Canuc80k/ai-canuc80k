<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Prompt gồm một system, hai cặp ví dụ, rồi thông báo cần trích.</title><rect x="30" y="20" width="100" height="30" rx="6" fill="#b8892b" fill-opacity="0.3" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="80" y="35.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">system</text><text xml:space="preserve" style="font-variant-ligatures:none" x="142" y="35.5" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">Trích ngày/tháng tổ chức và số học sinh… chỉ trả JSON…</text><rect x="30" y="60" width="100" height="30" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.3" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="80" y="75.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">user</text><text xml:space="preserve" style="font-variant-ligatures:none" x="142" y="75.5" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">{"notice": "Ngày 03/10 có 12 học sinh dự buổi đọc sách."}</text><rect x="30" y="100" width="100" height="30" rx="6" fill="var(--t-s, #4d7337)" fill-opacity="0.3" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="80" y="115.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">assistant</text><text xml:space="preserve" style="font-variant-ligatures:none" x="142" y="115.5" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">{"date": "03/10", "students": 12}</text><rect x="30" y="140" width="100" height="30" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.3" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="80" y="155.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">user</text><text xml:space="preserve" style="font-variant-ligatures:none" x="142" y="155.5" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">{"notice": "Buổi làm robot chưa có lịch và số người dự."}</text><rect x="30" y="180" width="100" height="30" rx="6" fill="var(--t-s, #4d7337)" fill-opacity="0.3" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="80" y="195.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">assistant</text><text xml:space="preserve" style="font-variant-ligatures:none" x="142" y="195.5" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">{"date": null, "students": null}</text><rect x="30" y="220" width="100" height="30" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.3" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="80" y="235.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">user</text><text xml:space="preserve" style="font-variant-ligatures:none" x="142" y="235.5" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">{"notice": "Buổi sinh hoạt ngày 12/10 có 18 học sinh."}</text><path d="M 620,64 L 626,64 L 626,182 L 620,182" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="270" fill="var(--muted, #73716a)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">hai cặp few-shot rồi thông báo cần trích</text></svg>