<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Log loss của câu hỏi: nộp one-hot dù đúng 90% cho khoảng 3.45, tệ hơn cả đoán đều ba lớp (1.10); nộp xác suất với p đúng khoảng 0.9 chỉ khoảng 0.11.</title><text x="210" y="51" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="400">nộp one-hot, đúng 90%</text><rect x="220" y="36" width="316.25" height="30" rx="3" fill="var(--accent, #c2603e)" fill-opacity="0.55" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="544.25" y="51" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">3.45</text><text x="210" y="97" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="400">đoán đều ba lớp</text><rect x="220" y="82" width="100.706" height="30" rx="3" fill="var(--faint, #a19e94)" fill-opacity="0.55" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="328.706" y="97" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">1.10</text><text x="210" y="143" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="400">nộp xác suất, p đúng ≈ 0.9</text><rect x="220" y="128" width="9.65805" height="30" rx="3" fill="var(--t-s, #4d7337)" fill-opacity="0.55" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="237.658" y="143" fill="var(--t-s, #4d7337)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">0.11</text><text x="390" y="190" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">log loss, thấp là tốt; mỗi ảnh sai với p = 10⁻¹⁵ góp 34.5</text></svg>