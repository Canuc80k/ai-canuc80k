<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Hai ảnh trong câu hỏi: Dice từng ảnh 0.947 và 0.182, trung bình theo ảnh 0.565; gộp pixel hai ảnh cho 0.905 vì vật lớn chiếm gần hết pixel.</title><rect x="200" y="26" width="322.105" height="26" rx="3" fill="var(--faint, #a19e94)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text x="190" y="39" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">ảnh A, vật lớn</text><text xml:space="preserve" style="font-variant-ligatures:none" x="530.105" y="39" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">0.947</text><rect x="200" y="66" width="61.8182" height="26" rx="3" fill="var(--faint, #a19e94)" fill-opacity="0.35" stroke="none" stroke-width="0"/><text x="190" y="79" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">ảnh B, vật nhỏ</text><text xml:space="preserve" style="font-variant-ligatures:none" x="269.818" y="79" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">0.182</text><rect x="200" y="106" width="191.962" height="26" rx="3" fill="var(--accent, #c2603e)" fill-opacity="0.55" stroke="none" stroke-width="0"/><text x="190" y="119" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">trung bình theo ảnh</text><text xml:space="preserve" style="font-variant-ligatures:none" x="399.962" y="119" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">0.565</text><rect x="200" y="146" width="307.861" height="26" rx="3" fill="var(--t-n, #2f6587)" fill-opacity="0.55" stroke="none" stroke-width="0"/><text x="190" y="159" fill="currentColor" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">gộp pixel</text><text xml:space="preserve" style="font-variant-ligatures:none" x="515.861" y="159" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">0.905</text><text x="370" y="196" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">vật lớn chiếm gần hết pixel nên cách gộp che lỗi bỏ sót vật nhỏ</text></svg>