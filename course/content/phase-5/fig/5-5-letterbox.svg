<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Letterbox: ảnh 1280×720 thu về 640×360 rồi đệm 140 pixel trên và dưới; box trên ảnh vuông phải trừ đệm trước, chia hệ số 0.5 sau mới về đúng ảnh gốc.</title><rect x="30" y="50" width="153.6" height="86.4" rx="3" fill="var(--t-n, #2f6587)" fill-opacity="0.16" stroke="none" stroke-width="0"/><rect x="54" y="74" width="48" height="24" rx="1" fill="none" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="2"/><text x="106.8" y="36" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">ảnh gốc 1280×720</text><text xml:space="preserve" style="font-variant-ligatures:none" x="106.8" y="154.4" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">(200, 200, 600, 400)</text><path d="M 206,94 L 252,94" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2" stroke-linecap="round"/><path d="M 244.695,97.2621 L 252,94 L 244.695,90.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="229" y="82" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">× 0.5</text><rect x="262" y="20" width="128" height="128" rx="3" fill="var(--faint, #a19e94)" fill-opacity="0.16" stroke="none" stroke-width="0"/><rect x="262" y="48" width="128" height="72" rx="0" fill="var(--t-n, #2f6587)" fill-opacity="0.16" stroke="none" stroke-width="0"/><rect x="282" y="68" width="40" height="20" rx="1" fill="none" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="2"/><text xml:space="preserve" style="font-variant-ligatures:none" x="326" y="34" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">đệm 140</text><text xml:space="preserve" style="font-variant-ligatures:none" x="326" y="140" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">đệm 140</text><text x="326" y="166" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">vào model 640×640</text><text xml:space="preserve" style="font-variant-ligatures:none" x="326" y="186" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">(100, 240, 300, 340)</text><text x="420" y="80" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">đổi về ảnh gốc:</text><text xml:space="preserve" style="font-variant-ligatures:none" x="420" y="106" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">1. trừ đệm: y − 140</text><text xml:space="preserve" style="font-variant-ligatures:none" x="420" y="130" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">2. chia s = 0.5</text><text x="420" y="164" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">làm ngược thứ tự là lệch box</text></svg>