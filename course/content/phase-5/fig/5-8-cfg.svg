<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Guidance đi tiếp w lần theo hướng từ dự đoán không prompt sang có prompt.</title><path d="M 90,190 L 210,140" fill="none" stroke="var(--t-n, #2f6587)" stroke-width="2" stroke-linecap="round"/><path d="M 204.512,145.821 L 210,140 L 202.003,139.798" fill="none" stroke="var(--t-n, #2f6587)" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="218" y="152" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="600">không prompt</text><path d="M 90,190 L 240,95" fill="none" stroke="var(--t-s, #4d7337)" stroke-width="2" stroke-linecap="round"/><path d="M 235.574,101.664 L 240,95 L 232.083,96.1525" fill="none" stroke="var(--t-s, #4d7337)" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="258" y="111" fill="var(--t-s, #4d7337)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="600">có prompt (w = 1)</text><path d="M 210,140 L 270,50" fill="none" stroke="var(--faint, #a19e94)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M 90,190 L 270,50" fill="none" stroke="var(--accent, #c2603e)" stroke-width="2.2" stroke-linecap="round"/><path d="M 266.237,57.0596 L 270,50 L 262.231,51.9097" fill="none" stroke="var(--accent, #c2603e)" stroke-width="2.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="278" y="54" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">w = 2</text><text xml:space="preserve" style="font-variant-ligatures:none" x="440" y="120" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">ε̂ = ε∅ + w (ε_c − ε∅)</text><text x="440" y="150" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">w lớn: bám prompt hơn,</text><text x="440" y="170" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">kém đa dạng, tốn gấp đôi</text></svg>