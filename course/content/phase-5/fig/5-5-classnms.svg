<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Người ngồi trên xe đạp (số từ code bài): hai box khác lớp chồng nhau với IoU 0.667; nms trộn lớp xóa box xe đạp, batched_nms chỉ so box cùng lớp nên giữ cả hai.</title><rect x="110" y="43.5" width="80" height="120" rx="1" fill="var(--t-n, #2f6587)" fill-opacity="0.1" stroke="var(--t-n, #2f6587)" stroke-width="1.8"/><text x="116" y="56.5" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="600">người 0.9</text><rect x="110" y="73.5" width="80" height="105" rx="1" fill="none" fill-opacity="1" stroke="var(--faint, #a19e94)" stroke-width="1.2"/><text xml:space="preserve" style="font-variant-ligatures:none" x="150" y="192.5" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">xe đạp bị xóa</text><text x="150" y="20" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="600">trộn lớp: nms</text><rect x="390" y="43.5" width="80" height="120" rx="1" fill="var(--t-n, #2f6587)" fill-opacity="0.1" stroke="var(--t-n, #2f6587)" stroke-width="1.8"/><text x="396" y="56.5" fill="var(--t-n, #2f6587)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="600">người 0.9</text><rect x="390" y="73.5" width="80" height="105" rx="1" fill="var(--accent, #c2603e)" fill-opacity="0.1" stroke="var(--accent, #c2603e)" stroke-width="1.8"/><text x="396" y="86.5" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="600