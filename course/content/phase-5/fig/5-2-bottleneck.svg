<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Bottleneck của ResNet-50 (layer1): conv 1×1 thu 256 kênh về 64, conv 3×3 chạy ở 64 kênh, conv 1×1 mở lại 256; 69 632 tham số so với 1 179 648 của hai conv 3×3 ở 256 kênh.</title><rect x="60" y="34" width="160" height="34" rx="7" fill="var(--t-n, #2f6587)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="140" y="51.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">1×1  256 → 64</text><rect x="60" y="80" width="160" height="34" rx="7" fill="var(--accent, #c2603e)" fill-opacity="0.24" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="140" y="97.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">3×3  64 → 64</text><rect x="60" y="126" width="160" height="34" rx="7" fill="var(--t-n, #2f6587)" fill-opacity="0.14" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="140" y="143.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">1×1  64 → 256</text><text x="140" y="20" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="600">bottleneck</text><text xml:space="preserve" style="font-variant-ligatures:none" x="140" y="190" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">69 632 tham số</text><rect x="300" y="57" width="160" height="34" rx="7" fill="var(--accent, #c2603e)" fill-opacity="0.24" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="380" y="74.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">3×3  256 → 256</text><rect x="300" y="103" width="160" height="34" rx="7" fill="var(--accent, #c2603e)" fill-opacity="0.24" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="380" y="120.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">3×3  256 → 256</text><text x="380" y="20" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12.5" font-weight="600">hai conv 3×3 ở 256 kênh</text><text xml:space="preserve" style="font-variant-ligatures:none" x="380" y="190" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="600">1 179 648 tham số</text><text x="560" y="100" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">ít hơn</text><text xml:space="preserve" style="font-variant-ligatures:none" x="560" y="122" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="600">≈ 17 lần</text></svg>