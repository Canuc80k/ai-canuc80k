<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Cùng lỗi tuyệt đối 1, lỗi tương đối phụ thuộc độ lớn target.</title><text xml:space="preserve" style="font-variant-ligatures:none" x="30" y="34" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">thật   1, đoán   2</text><rect x="220" y="22" width="300" height="24" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.75" stroke="none" stroke-width="0"/><text x="528" y="34" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13" font-weight="600">100%</text><text xml:space="preserve" style="font-variant-ligatures:none" x="30" y="80" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">thật  10, đoán  11</text><rect x="220" y="68" width="30" height="24" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.75" stroke="none" stroke-width="0"/><text x="258" y="80" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13" font-weight="600">10%</text><text xml:space="preserve" style="font-variant-ligatures:none" x="30" y="126" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12.5" font-weight="400">thật 100, đoán 101</text><rect x="220" y="114" width="3" height="24" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.75" stroke="none" stroke-width="0"/><text x="231" y="126" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--sans, Inter, "Seg