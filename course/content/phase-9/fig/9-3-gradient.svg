<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Một mẫu của bài với nhãn 1: lượt xuôi cho logit 0, xác suất 0.5, loss 0.693; lượt ngược dùng p − y = −0.5 nhân với từng feature, và một bước η = 0.1 hạ loss còn 0.554.</title><rect x="-2" y="40" width="124" height="36" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.18" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="60" y="58.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">x = (1, 2)</text><path d="M 124,58 L 146,58" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" stroke-linecap="round"/><path d="M 138.695,61.2621 L 146,58 L 138.695,54.7379" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="148" y="40" width="124" height="36" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.18" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="210" y="58.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">z = w·x + b = 0</text><path d="M 274,58 L 306,58" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" stroke-linecap="round"/><path d="M 298.695,61.2621 L 306,58 L 298.695,54.7379" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="308" y="40" width="124" height="36" rx="6" fill="var(--t-n, #2f6587)" fill-opacity="0.18" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="370" y="58.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">p = σ(z) = 0.5</text><path d="M 434,58 L 456,58" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" stroke-linecap="round"/><path d="M 448.695,61.2621 L 456,58 L 448.695,54.7379" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="458" y="40" width="124" height="36" rx="6" fill="var(--accent, #c2603e)" fill-opacity="0.18" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="520" y="58.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">L = 0.693</text><path d="M 520,78 Q 371,144.5 210,118" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 217.738,115.968 L 210,118 L 216.678,122.405" fill="none" stroke="var(--accent, #c2603e)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="370" y="132" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="600">∂L/∂z = p − y = −0.5</text><text xml:space="preserve" style="font-variant-ligatures:none" x="210" y="160" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">∇_w L = (p − y)·x = (−0.5, −1)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="210" y="180" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">∂L/∂b = −0.5</text><text xml:space="preserve" style="font-variant-ligatures:none" x="470" y="172" fill="var(--t-s, #4d7337)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="600">bước η = 0.1: L → 0.554</text></svg>