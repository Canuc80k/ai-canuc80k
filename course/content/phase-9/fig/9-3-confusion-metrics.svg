<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Confusion matrix của detector: cột cảnh báo (khung đứt) có 18 đúng và 98 nhầm, nên precision chỉ 0.155 dù recall 0.9; baseline luôn đoán sạch có accuracy 0.98 mà không bắt được bài lỗi nào.</title><rect x="150" y="50" width="90" height="52" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.5" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="195" y="76.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">18</text><rect x="246" y="50" width="90" height="52" rx="4" fill="var(--accent, #c2603e)" fill-opacity="0.15" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="291" y="76.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">2</text><rect x="150" y="108" width="90" height="52" rx="4" fill="#b8892b" fill-opacity="0.45" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="195" y="134.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">98</text><rect x="246" y="108" width="90" height="52" rx="4" fill="var(--t-n, #2f6587)" fill-opacity="0.1" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="291" y="134.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="15" font-weight="400">882</text><text x="195" y="36" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">cảnh báo</text><text x="291" y="36" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">không</text><text x="140" y="76" fill="var(--muted, #73716a)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">có lỗi</text><text x="140" y="134" fill="var(--muted, #73716a)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">sạch</text><rect x="147" y="47" width="96" height="116" rx="6" fill="none" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="1.4" stroke-dasharray="4 4"/><text xml:space="preserve" style="font-variant-ligatures:none" x="400" y="66" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">recall 18/20 = 0.900</text><text xml:space="preserve" style="font-variant-ligatures:none" x="400" y="90" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="600">precision 18/116 = 0.155</text><text xml:space="preserve" style="font-variant-ligatures:none" x="400" y="114" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">accuracy 900/1000 = 0.900</text><text xml:space="preserve" style="font-variant-ligatures:none" x="400" y="138" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">F1 36/136 = 0.265</text><text xml:space="preserve" style="font-variant-ligatures:none" x="400" y="172" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">luôn đoán sạch: acc 0.98, recall 0</text></svg>