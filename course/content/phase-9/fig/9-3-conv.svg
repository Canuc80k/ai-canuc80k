<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Conv2d: input (4, 3, 8, 8) ra (4, 2, 4, 4), 56 tham số.</title><rect x="60" y="70" width="80" height="80" rx="2" fill="none" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1"/><rect x="66" y="64" width="80" height="80" rx="2" fill="none" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1"/><rect x="72" y="58" width="80" height="80" rx="2" fill="var(--t-n, #2f6587)" fill-opacity="0.2" stroke="var(--t-n, #2f6587)" stroke-width="1"/><text xml:space="preserve" style="font-variant-ligatures:none" x="109" y="168" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="600">(4, 3, 8, 8)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="109" y="184" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10" font-weight="400">3 channel, 8 × 8</text><path d="M 180,110 L 260,110" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.4" stroke-linecap="round"/><path d="M 252.695,113.262 L 260,110 L 252.695,106.738" fill="none" stroke="var(--muted, #73716a)" stroke-width="1.4" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="220" y="92" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10" font-weight="400">k = 3, p = 1, s = 2</text><rect x="290" y="90" width="40" height="40" rx="2" fill="none" fill-opacity="1" stroke="var(--accent, #c2603e)" stroke-width="1"/><rect x="296" y="84" width="40" height="40" rx="2" fill="var(--accent, #c2603e)" fill-opacity="0.2" stroke="var(--accent, #c2603e)" stroke-width="1"/><text xml:space="preserve" style="font-variant-ligatures:none" x="316" y="148" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="600">(4, 2, 4, 4)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="316" y="164" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10" font-weight="400">⌊(8 + 2 − 3)/2⌋ + 1 = 4</text><text xml:space="preserve" style="font-variant-ligatures:none" x="440" y="80" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">tham số</text><text xml:space="preserve" style="font-variant-ligatures:none" x="440" y="104" fill="currentColor" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="600">2 × (3·3·3 + 1) = 56</text><text xml:space="preserve" style="font-variant-ligatures:none" x="440" y="132" fill="var(--muted, #73716a)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">batch 4 không nhân vào</text></svg>