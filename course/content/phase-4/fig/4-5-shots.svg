<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Ba cách dùng ví dụ có nhãn của nhiệm vụ mới: zero-shot không dùng, few-shot đặt vài ví dụ vào prompt, fine-tuning dùng chúng để cập nhật trọng số.</title><text x="115" y="22" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13" font-weight="600">zero-shot</text><rect x="20" y="40" width="190" height="36" rx="7" fill="var(--faint, #a19e94)" fill-opacity="0.12" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="115" y="58.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="12" font-weight="400">x → ?</text><path d="M 115,80 L 115,104" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2" stroke-linecap="round"/><path d="M 111.738,96.6953 L 115,104 L 118.262,96.6953" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="108" width="190" height="40" rx="7" fill="var(--t-n, #2f6587)" fill-opacity="0.16" stroke="none" stroke-width="0"/><text x="115" y="128" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="400">trọng số giữ nguyên</text><text x="115" y="174" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">không dùng ví dụ có nhãn</text><text x="325" y="22" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="13" font-weight="600">few-shot</text><rect x="230" y="40" width="190" heigh