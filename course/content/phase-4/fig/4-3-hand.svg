<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Learning rate 0.1 cho head, 0.01 cho encoder: a lên 1.4, w chỉ nhích tới 2.02.</title><rect x="40" y="60" width="90" height="44" rx="8" fill="var(--t-n, #2f6587)" fill-opacity="0.16" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="85" y="82.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="400">w = 2</text><text x="85" y="46" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">encoder</text><rect x="250" y="60" width="90" height="44" rx="8" fill="var(--accent, #c2603e)" fill-opacity="0.2" stroke="none" stroke-width="0"/><text xml:space="preserve" style="font-variant-ligatures:none" x="295" y="82.5" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="13" font-weight="400">a = 1</text><text x="295" y="46" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">head</text><path d="M 134,82 L 246,82" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" stroke-linecap="round"/><path d="M 238.695,85.2621 L 246,82 L 238.695,78.7379" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" style="font-variant-ligatures:none" x="190" y="72" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">wx = 2</text><p