="preserve" style="font-variant-ligatures:none" x="330" y="172" fill="var(--accent, #c2603e)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11.5" font-weight="400">∂L/∂a = −4, η 0.1 → a = 1.4</text></svg>