<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640"   style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Phổ nửa sau sau khi hạ về 1000 Hz (số từ code bài): bỏ mẫu sinh âm giả 400 Hz biên độ 0.400, đúng bằng đoạn 600 Hz bị gập; resample_poly lọc trước nên ở 400 Hz bằng 0.</title><path d="M 60,160 L 300,160" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1" stroke-linecap="round"/><text x="52" y="160" fill="var(--faint, #a19e94)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">0</text><text x="52" y="106.667" fill="var(--faint, #a19e94)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">0.2</text><text x="52" y="53.3333" fill="var(--faint, #a19e94)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">0.4</text><text x="60" y="174" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">0</text><text x="156" y="174" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">200</text><text x="252" y="174" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">400</text><text x="300" y="190" fill="var(--faint, #a19e94)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">Hz</text><path d="M 252,160 L 252,53.3333" fill="none" stroke="var(--accent, #c2603e)" stroke-width="2.4" stroke-linecap="round"/><text x="180" y="24" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">bỏ mẫu waveform[::2]</text><text xml:space="preserve" style="font-variant-ligatures:none" x="252" y="43.3333" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">400 Hz: 0.400</text><path d="M 360,160 L 600,160" fill="none" stroke="var(--line-strong, #d3cebf)" stroke-width="1" stroke-linecap="round"/><text x="360" y="174" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">0</text><text x="456" y="174" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">200</text><text x="552" y="174" fill="var(--faint, #a19e94)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11" font-weight="400">400</text><text x="600" y="190" fill="var(--faint, #a19e94)" text-anchor="end" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">Hz</text><text x="480" y="24" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="12" font-weight="600">resample_poly (có lọc)</text><text xml:space="preserve" style="font-variant-ligatures:none" x="552" y="144.667" fill="var(--t-s, #4d7337)" text-anchor="middle" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="11" font-weight="400">400 Hz: 0.000</text><text x="320" y="206" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">nửa sau chỉ có âm 600 Hz; ở 1000 Hz, Nyquist còn 500 Hz</text></svg>