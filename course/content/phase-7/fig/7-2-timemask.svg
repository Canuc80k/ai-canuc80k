<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" style="font-family:var(--serif, Lora, Georgia, serif);color:var(--text, #1f1e1c)"><title>Time mask dài hơn sự kiện có thể che trọn tiếng gõ mà nhãn vẫn là “gõ cửa”.</title><rect x="40" y="50" width="560" height="30" rx="3" fill="var(--faint, #a19e94)" fill-opacity="0.12" stroke="none" stroke-width="0"/><rect x="292" y="50" width="14" height="30" rx="1" fill="var(--accent, #c2603e)" fill-opacity="0.8" stroke="none" stroke-width="0"/><text x="297.6" y="40" fill="var(--accent, #c2603e)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">tiếng gõ 5 frame</text><rect x="236" y="46" width="112" height="38" rx="3" fill="none" fill-opacity="1" stroke="var(--t-n, #2f6587)" stroke-width="1.6"/><text x="292" y="104" fill="var(--t-n, #2f6587)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">time mask 40 frame</text><text xml:space="preserve" style="font-variant-ligatures:none" x="40" y="104" fill="var(--faint, #a19e94)" text-anchor="start" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">0</text><text xml:space="preserve" style="font-variant-ligatures:none" x="600" y="104" fill="var(--faint, #a19e94)" text-anchor="end" dominant-baseline="middle" font-family='var(--mono, "JetBrains Mono", Consolas, monospace)' font-size="10.5" font-weight="400">2 s</text><text x="320" y="146" fill="var(--muted, #73716a)" text-anchor="middle" dominant-baseline="middle" font-family='var(--sans, Inter, "Segoe UI", sans-serif)' font-size="11.5" font-weight="400">mask rộng hơn sự kiện ngắn nhất có thể che trọn bằng chứng mà nhãn vẫn là “gõ cửa”</text></svg>